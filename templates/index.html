<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Online Video Encoder</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <main class="container">
    <section class="card">
      <h1>🎬 Online Video Encoder</h1>
      <p class="sub">Upload a video or use a direct video URL, then encode with FFmpeg.</p>

      <div class="tabs">
        <button type="button" class="tab active" data-mode="file">📁 Upload File</button>
        <button type="button" class="tab" data-mode="url">🔗 Direct URL</button>
      </div>

      <form id="encoderForm">
        <div id="fileMode">
          <label class="drop">
            <input id="file" name="file" type="file" accept="video/*">
            <span id="fileText">📁 Choose a video</span>
          </label>
        </div>

        <div id="urlMode" class="hidden">
          <label class="urlLabel">Direct video URL
            <input id="urlInput" name="url" type="url" placeholder="https://example.com/video.mp4" autocomplete="off">
          </label>
          <p class="hint">Use a direct video file link (.mp4, .mkv, .webm, etc.), not a normal webpage link.</p>
        </div>

        <div class="grid">
          <label>Resolution
            <select name="resolution">
              <option value="1080p">1080p</option>
              <option value="720p">720p</option>
              <option value="480p">480p</option>
              <option value="original">Original</option>
            </select>
          </label>

          <label>Codec
            <select name="codec">
              <option value="h264">H.264</option>
              <option value="h265">H.265 / HEVC</option>
              <option value="vp9">VP9</option>
            </select>
          </label>

          <label>CRF
            <input name="crf" type="number" min="0" max="51" value="23">
          </label>

          <label>Preset
            <select name="preset">
              <option>ultrafast</option>
              <option>superfast</option>
              <option>veryfast</option>
              <option>faster</option>
              <option>fast</option>
              <option selected>medium</option>
              <option>slow</option>
            </select>
          </label>

          <label>Audio bitrate
            <select name="audio_bitrate">
              <option>96k</option>
              <option selected>128k</option>
              <option>160k</option>
              <option>192k</option>
              <option>256k</option>
            </select>
          </label>
        </div>

        <button id="encodeBtn" type="submit">🚀 Encode Video</button>
      </form>

      <div id="status" class="status hidden"></div>
      <div id="progress" class="bar hidden"><div></div></div>
      <a id="download" class="download hidden">⬇️ Download Encoded Video</a>
    </section>
  </main>

<script>
const form = document.getElementById("encoderForm");
const fileInput = document.getElementById("file");
const fileText = document.getElementById("fileText");
const urlInput = document.getElementById("urlInput");
const fileMode = document.getElementById("fileMode");
const urlMode = document.getElementById("urlMode");
const tabs = document.querySelectorAll(".tab");
const statusBox = document.getElementById("status");
const progress = document.getElementById("progress");
const progressInner = progress.querySelector("div");
const btn = document.getElementById("encodeBtn");
const download = document.getElementById("download");
let mode = "file";

tabs.forEach(tab => tab.addEventListener("click", () => {
  mode = tab.dataset.mode;
  tabs.forEach(t => t.classList.toggle("active", t === tab));
  fileMode.classList.toggle("hidden", mode !== "file");
  urlMode.classList.toggle("hidden", mode !== "url");
  fileInput.required = mode === "file";
  urlInput.required = mode === "url";
}));

fileInput.addEventListener("change", () => {
  fileText.textContent = fileInput.files[0]
    ? "🎞️ " + fileInput.files[0].name
    : "📁 Choose a video";
});

form.addEventListener("submit", async (e) => {
  e.preventDefault();
  if (mode === "file" && !fileInput.files[0]) return;
  if (mode === "url" && !urlInput.value.trim()) return;

  btn.disabled = true;
  download.classList.add("hidden");
  statusBox.classList.remove("hidden");
  progress.classList.remove("hidden");
  progressInner.style.width = "15%";
  statusBox.textContent = mode === "url" ? "Downloading video from URL..." : "Uploading video...";

  const data = new FormData(form);
  if (mode === "file") data.delete("url");
  if (mode === "url") data.delete("file");

  try {
    const response = await fetch("/encode", { method: "POST", body: data });
    progressInner.style.width = "75%";
    statusBox.textContent = "Encoding with FFmpeg...";

    if (!response.ok) {
      const text = await response.text();
      throw new Error(text);
    }

    const blob = await response.blob();
    const url = URL.createObjectURL(blob);
    download.href = url;
    download.download = "encoded_video.mp4";
    download.classList.remove("hidden");
    progressInner.style.width = "100%";
    statusBox.textContent = "✅ Encoding completed!";
  } catch (err) {
    statusBox.textContent = "❌ " + err.message;
    progressInner.style.width = "0%";
  } finally {
    btn.disabled = false;
  }
});
</script>
</body>
</html>
